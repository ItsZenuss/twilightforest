plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = (hasProperty("CIRevision") ? CIRevision : project.mod_version)
group = group_name

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(25))
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << "-Xlint:none" << "-Xmaxerrs" << "100000"
	options.encoding = 'UTF-8'
}

base {
	archivesName = "${project.mod_id}-${project.minecraft_version}"
}

idea {
	module {
		downloadJavadoc = true
		downloadSources = true
	}
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name 'Tama\'s Maven'
		url 'https://maven.tamaized.com/releases/'
		content {
			includeGroup("tamaized")
		}
	}
	maven {
		name 'Jared\'s Maven' // JEI
		url 'https://maven.blamejared.com/'
	}
	maven {
		name = "Curios"
		url = uri("https://maven.theillusivec4.top/")
	}
	maven {
		name 'Shedaniel\'s Maven' // REI
		url "https://maven.shedaniel.me"
	}
	maven {
		name = "TerraformersMC" // EMI, Trinkets
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name 'Curseforge Maven'
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

configurations {
	// Mockito's inline mock maker, loaded as a Java agent (self-attaching is going away in newer JDKs)
	mockitoAgent
}

dependencies {
	// Minecraft + Fabric
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}+${project.minecraft_version}"

	// Annotations (Nullable, etc.)
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "org.jetbrains:annotations:26.0.2"

	// Compat compileOnly APIs (Trinkets, JEI, Jade)
	compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
	// Curios has no Fabric build; its compat targets Trinkets Updated (provides mod id "trinkets") instead
	compileOnly "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	compileOnly "dev.yumi.commons:yumi-commons-event:${project.yumi_commons_version}"
	localRuntime "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	// Trinkets injects interfaces into ItemStack, so tests that touch ItemStack need its classes on the classpath
	testImplementation "maven.modrinth:trinkets-updated:${project.trinkets_version}"
	compileOnly "curse.maven:jade-324717:${project.jade_file_id}"


	// Testing
	testImplementation "org.junit.jupiter:junit-jupiter:6.0.1"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:6.0.1"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.0.1"
	testImplementation "org.mockito:mockito-junit-jupiter:5.21.0"
	mockitoAgent("org.mockito:mockito-core:5.21.0") { transitive = false }
	// Runs tests inside Fabric Loader (Knot) so mixins, access wideners and injected interfaces apply
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

loom {
	accessWidenerPath = file("src/main/resources/twilightforest.accesswidener")

	runs {
		client {
			client()
			name = "Minecraft Client"
			runDir "run"
		}
		server {
			server()
			name = "Minecraft Server"
			runDir "run"
		}
		clientTest {
			client()
			name = "Client Smoke Test"
			runDir "run"
			vmArg "-Dtwilightforest.smoketest=true"
			vmArg "-Dtwilightforest.smoketest.teleport=true"
			vmArg "-Dtwilightforest.smoketest.screenshots=true"
			vmArg "-Dtwilightforest.smoketest.showcase=true"
			// ./gradlew runClientTest -PtfFocus=twilightforest:hydra spawns just that entity in front of the player instead
			if (project.hasProperty('tfFocus')) vmArg "-Dtwilightforest.smoketest.focus=${project.property('tfFocus')}"
			if (project.hasProperty('tfFocusAi')) vmArg "-Dtwilightforest.smoketest.focus.ai=true"
			if (project.hasProperty('tfFocusDistance')) vmArg "-Dtwilightforest.smoketest.focus.distance=${project.property('tfFocusDistance')}"
			programArgs "--quickPlaySingleplayer", "tftest"
		}
		gametest {
			server()
			name = "Game Test"
			runDir "run-gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dtwilightforest.smoketest=true"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/gametest-report.xml")}"
		}
		datagen {
			client()
			name = "Data Generation"
			runDir "run-data"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
			vmArg "-Dfabric-api.datagen.modid=twilightforest"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDir 'src/generated/resources'
			exclude '.cache'
		}
	}
}

def modVersionForResources = project.version.toString()
processResources {
	inputs.property "version", modVersionForResources

	filesMatching("fabric.mod.json") {
		filter { line -> line.replace('${version}', modVersionForResources) }
	}
}

def jarArchivesName = project.base.archivesName.get()
def jarProjectName = project.name
def jarVersion = project.version.toString()
def jarModId = project.mod_id
jar {
	// Compile-time stand-in for a JEI internal class; the real one comes from JEI when it's installed.
	exclude 'mezz/**'
	from("LICENSE") {
		rename { "${it}_${jarArchivesName}" }
	}
	manifest {
		attributes([
			'Specification-Title'     : jarModId,
			'Specification-Vendor'    : "TeamTwilight",
			'Specification-Version'   : "1",
			'Implementation-Title'    : jarProjectName,
			'Implementation-Version'  : jarVersion,
			'Implementation-Vendor'   : "TeamTwilight"
		])
	}
}

test {
	useJUnitPlatform()
	def mockitoAgentFiles = configurations.mockitoAgent
	jvmArgumentProviders.add({ ["-javaagent:${mockitoAgentFiles.singleFile}"] } as CommandLineArgumentProvider)
	testLogging {
		events "failed"
		showExceptions true
		exceptionFormat "full"
		showCauses true
		showStackTraces true
		showStandardStreams = false
	}
}

def mavenUser = System.getenv("MAVEN_USER")
def mavenToken = System.getenv("MAVEN_PASS")

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
			groupId 'team-twilight'
			artifactId project.mod_id
		}
	}
	repositories {
		maven {
			url "https://maven.tamaized.com/releases"
			credentials {
				username mavenUser
				password mavenToken
			}
		}
	}
}
